[global]
keyboard = "en-us"
timezone = "UTC"
root_password = "|>images/linux:password<|"
mailto = "root@localhost"

[network]
source = "E>'from-dhcp' if '>>ip<<' == 'dhcp' or '>>ip<<' == '' else 'from-answer'<E"
cidr = ">>ip<</>>prefix_length<<"
gateway = ">>gateway<<"
dns = ">>dns1<<"
fqdn = ">>fqdn<<"

[disk-setup]
filesystem = "ext4"
disk_list = ["sda"]
